name: OpenAIRAC Map CI

on:
  push:
    branches: [ master, develop/**, release/** ]
  pull_request:
    branches: [ master ]

jobs:
  build-linux-qt6:
    name: Full Application Qt6 Build (Ubuntu 24.04 / GCC)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OpenAIRAC Map
        uses: actions/checkout@v4
        with:
          path: openairac-map

      - name: Checkout atools
        uses: actions/checkout@v4
        with:
          repository: albar965/atools
          path: atools

      - name: Checkout marble
        uses: actions/checkout@v4
        with:
          repository: albar965/marble
          ref: lnm/1.1
          path: marble

      - name: Install System Dependencies (Qt 6.5+ & Tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev libqt6svg6-dev libqt6sql6-sqlite qt6-base-dev-tools libqt6core5compat6-dev g++ make cmake zlib1g-dev

      - name: Build atools
        run: |
          mkdir -p build-atools-release
          cd build-atools-release
          qmake6 ../atools/atools.pro CONFIG+=release ATOOLS_NO_CRASHHANDLER=true
          make -j$(nproc)

      - name: Build Marble Widget
        run: |
          mkdir -p build-marble-release
          cd build-marble-release
          cmake -DCMAKE_BUILD_TYPE=Release -DSTATIC_BUILD=FALSE -DQTONLY=TRUE -DBUILD_MARBLE_APPS=NO -DBUILD_MARBLE_EXAMPLES=NO -DBUILD_MARBLE_TESTS=NO -DBUILD_MARBLE_TOOLS=NO -DBUILD_TESTING=NO -DBUILD_WITH_DBUS=NO -DMARBLE_EMPTY_MAPTHEME=YES -DMOBILE=NO -DWITH_DESIGNER_PLUGIN=NO -DWITH_Phonon=NO -DWITH_Qt5Location=NO -DWITH_Qt5Positioning=NO -DWITH_Qt5SerialPort=NO -DWITH_ZLIB=NO -DWITH_libgps=NO -DWITH_libshp=NO -DWITH_libwlocate=NO -DCMAKE_INSTALL_PREFIX=$PWD/../Marble-release -DEXEC_INSTALL_PREFIX=$PWD/../Marble-release ../marble/
          make -j$(nproc)
          make install || true

      - name: Build OpenAIRAC Map (Full littlenavmap binary)
        run: |
          mkdir -p build-openairac-map-release
          cd build-openairac-map-release
          export ATOOLS_INC_PATH=$PWD/../atools/src
          export ATOOLS_LIB_PATH=$PWD/../build-atools-release
          export MARBLE_INC_PATH=$PWD/../Marble-release/include
          export MARBLE_LIB_PATH=$PWD/../build-marble-release/src/lib/marble
          export ATOOLS_NO_CRASHHANDLER=true
          qmake6 ../openairac-map/littlenavmap.pro CONFIG+=release
          make -j$(nproc)
          ls -la littlenavmap
  subsystem-static-integrity:
    name: Subsystem & Docs Static Integrity (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout OpenAIRAC Map
        uses: actions/checkout@v4
        with:
          path: openairac-map
      - name: Checkout atools
        uses: actions/checkout@v4
        with:
          repository: albar965/atools
          path: atools

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify OpenAIRAC Subsystem & Documentation Integrity
        shell: bash
        run: |
          cd openairac-map
          python tools/scan_leaks.py .
          python tools/check_doc_links.py
          test -f src/openairac/navigationprovider.h
          test -f src/openairac/provenancemanager.h
          test -f src/openairac/coveragemanager.h
          test -f src/openairac/openairacdbmanager.h
          test -f src/openairac/efb/activeflightdock.h
          test -f src/openairac/product/firstrunwizard.h
          test -f src/openairac/product/datamanagerdialog.h
          test -f src/openairac/product/appupdater.h
          test -f docs/USER_GUIDE.md
          test -f docs/INSTALLATION.md
          test -f docs/FIRST_FLIGHT_TUTORIAL.md
          test -f docs/SIMULATOR_SETUP.md
          test -f docs/DATA_AND_PROVIDERS.md
          test -f docs/RUSSIA_CAICA_GUIDE.md
          test -f docs/SAVING_AND_EXPORTING.md
          test -f docs/AI_CREW_GATEWAY.md
          test -f docs/TROUBLESHOOTING.md
          test -f docs/FAQ.md
          test -f docs/PRIVACY_AND_SECURITY.md
          echo "OpenAIRAC Map Windows workspace integrity verified."
