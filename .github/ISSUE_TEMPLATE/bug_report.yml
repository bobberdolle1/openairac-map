name: Bug Report
description: Report a bug, crash, or UI issue in OpenAIRAC Map
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve OpenAIRAC Map!
  - type: input
    id: version
    attributes:
      label: OpenAIRAC Map Version
      placeholder: e.g. v1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. Windows 11 x64, Ubuntu 24.04, macOS 14
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Issue
      placeholder: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: OpenAIRAC Diagnostic Report
      description: Open `Tools > OpenAIRAC Diagnostics`, click `Copy Diagnostic Report` and paste it here.
      render: text
